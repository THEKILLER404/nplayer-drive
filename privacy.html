<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Privacy Policy — nPlayer Drive.">
<meta name="theme-color" content="#080a0f">
<title>Privacy Policy &mdash; nPlayer Drive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 8 L56 48 L8 48 Z' fill='none' stroke='%234285F4' stroke-width='6' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='38' r='5' fill='%2334A853'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: rgba(66,133,244,.35); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #080a0f; color: #e8ebf1; padding: 24px;
    background-image:
      radial-gradient(800px 500px at 15% 5%, rgba(66,133,244,.13), transparent 60%),
      radial-gradient(700px 500px at 90% 95%, rgba(52,168,83,.09), transparent 60%),
      radial-gradient(500px 400px at 80% 10%, rgba(156,39,176,.06), transparent 60%);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 30%, transparent 75%);
  }
  .card {
    position: relative; max-width: 580px; width: 100%; text-align: center;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 22px; padding: 52px 44px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
    background: linear-gradient(90deg, transparent, #4285F4, #34A853, transparent);
    border-radius: 2px;
  }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.8px; margin-bottom: 14px; }
  p.desc { color: #98a2b3; font-size: 16.5px; line-height: 1.65; margin-bottom: 34px; }
  a.btn {
    display: inline-block; color: #e8ebf1; text-decoration: none; font-size: 14px; font-weight: 600;
    border: 1px solid rgba(255,255,255,.16); padding: 12px 26px; border-radius: 13px;
    background: rgba(255,255,255,.04); transition: all .2s;
  }
  a.btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.28); transform: translateY(-1px); }
  footer { margin-top: 30px; font-size: 12.5px; color: #5c6572; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Privacy Policy</h1>
    <p class="desc">This is a personal project for Drive file browsing and login.</p>
    <a class="btn" href="index.html">&larr; Back to home</a>
    <footer>Built for personal use &middot; 2026</footer>
  </div>
</body>
</html>
